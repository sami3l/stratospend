spring:
  application:
    name: stratospend-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cloudcost}
    username: ${DB_USERNAME:cloudcost}
    password: ${DB_PASSWORD:cloudcost-local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      # Cost CSV uploads; larger files are rejected with 413 before reaching the controller.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Read and discard rejected uploads up to this size, so clients receive the 413 response instead of a reset connection.
    max-swallow-size: 10MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cost:
    # Imports accept only this ISO 4217 currency until exchange rates are supported.
    currency: ${APP_COST_CURRENCY:USD}
